# Development EC2: host ports 80 and 8080 both reach Spring Boot on port 8080.
services:
  app:
    image: ${DOCKER_IMAGE}
    container_name: keepit-app
    restart: always
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8080:8080"
      - "80:8080"
