# Development EC2: host ports 80 and 8080 both reach Spring Boot on port 8080.
services:
  app:
    image: ${DOCKER_IMAGE}
    container_name: keepit-app
    restart: always
    env_file:
      # 배포 중에는 교체 후보 환경 파일을 검증하고, 평소에는 .env를 읽는다.
      - ${KEEPIT_APP_ENV_FILE:-.env}
    environment:
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8080:8080"
      - "80:8080"
