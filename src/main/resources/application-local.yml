spring:
  datasource:
    url: jdbc:mysql://localhost:3306/${DB_NAME:keepit}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:keepit}
    password: ${DB_PASSWORD:keepit}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  # 로컬 개발 전용 기본값 (32바이트 이상). 운영에서는 반드시 JWT_SECRET 환경변수 사용
  secret: ${JWT_SECRET:local-dev-secret-key-must-be-at-least-32-bytes-long}

logging:
  level:
    com.keepit: debug
