# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: ko-KR

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
      - develop
  path_filters:
    - "!**/gradle/wrapper/**"
    - "!**/build/**"
  path_instructions:
    - path: "src/main/java/**/*.java"
      instructions: |
        Spring Boot 4 / Java 17 기준으로 리뷰해 주세요.
        - 레이어 책임 분리(Controller / Service / Repository)
        - JPA N+1, 트랜잭션 범위, 지연 로딩 이슈
        - Spring Security / JWT 관련 보안 취약점
        - 예외 처리와 입력값 검증(@Valid)
    - path: "src/main/resources/db/migration/**/*.sql"
      instructions: |
        Flyway 마이그레이션입니다. 이미 배포된 마이그레이션 파일 수정 여부, MySQL 8.4 호환성,
        인덱스/제약조건, 대용량 테이블 락 위험을 확인해 주세요.
    - path: "src/test/**/*.java"
      instructions: "테스트가 의미 있는 검증을 하는지, 경계값/예외 케이스가 포함됐는지 확인해 주세요."

chat:
  auto_reply: true
