name: Deploy to EC2

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: keepit-dev-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: keepit-dev-app
  AWS_ACCOUNT_ID: '781953768324'

jobs:
  deploy:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/keepit-dev-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Check immutable image tag
        id: image
        run: |
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to ECR
        if: steps.image.outputs.exists == 'false'
        run: |
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

      - name: Build and push image
        if: steps.image.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # provenance attestation을 올리지 않아 배포 1회당 ECR 이미지가 1개만 생기고, 수명 주기 정책(최근 10개)이 배포 횟수 기준으로 동작한다.
          provenance: false
          tags: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy through SSM
        # 앱 환경값은 빌드 단계에 전달하지 않고 SSM 배포 단계에서만 읽는다.
        env:
          KEEPIT_ENV_DB_URL: ${{ secrets.DB_URL }}
          KEEPIT_ENV_DB_USERNAME: ${{ secrets.DB_USERNAME }}
          KEEPIT_ENV_DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          KEEPIT_ENV_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          KEEPIT_ENV_AWS_REGION: ${{ secrets.AWS_REGION }}
          KEEPIT_ENV_AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          KEEPIT_ENV_KAKAO_APP_ID: ${{ secrets.KAKAO_APP_ID }}
        run: |
          latest_ref=$(git ls-remote --exit-code origin refs/heads/develop)
          read -r latest_sha _ <<< "$latest_ref"
          if [ "$latest_sha" != "$GITHUB_SHA" ]; then
            echo "::notice::Skipping deployment because develop has moved past this commit."
            exit 0
          fi
          python infra/scripts/deploy_ssm.py \
            --region "$AWS_REGION" \
            --image "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$GITHUB_SHA"
