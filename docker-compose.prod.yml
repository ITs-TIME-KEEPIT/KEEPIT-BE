# 개발 EC2용: Spring Boot 앱을 8080 포트로 직접 노출
#   배포 디렉터리에 이 파일과 .env 를 둔다.
#   docker compose -f docker-compose.prod.yml up -d
services:
  app:
    image: ${DOCKER_IMAGE}
    container_name: keepit-app
    restart: always
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8080:8080"
